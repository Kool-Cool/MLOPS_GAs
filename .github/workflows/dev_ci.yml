# dev_ci.yml
name: Dev CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install dvc[gs] pytest cml
    - name: Pull data and model from DVC
      run: |
        dvc pull
    - name: Run tests
      run: |
        pytest tests > report.txt
    - name: Comment results
      env:
        REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        cml comment report.txt
